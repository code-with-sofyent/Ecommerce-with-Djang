<header class="absolute inset-x-0 top-0 z-50">
    <nav class="flex items-center justify-between p-6 lg:px-8" aria-label="Global">
      <div class="flex lg:flex-1">
        <a href="#" class="-m-1.5 p-1.5">
          <span class="sr-only">Your Company</span>
          <img class="h-8 w-auto" src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600" alt="">
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <div class="flex lg:hidden">
        <button type="button" class="-m-2.5 inline-flex items-center justify-center rounded-md p-2.5 text-gray-700">
          <span class="sr-only">Open main menu</span>
          <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>
      </div>

      <!-- Desktop Navigation Links -->
      <div class="hidden lg:flex lg:gap-x-12">
        <a href="/" class="text-sm font-semibold text-gray-900 hover:text-indigo-600">Home</a>
        <a href="/shop" class="text-sm font-semibold text-gray-900 hover:text-indigo-600">Shop</a>
        <a href="/categories" class="text-sm font-semibold text-gray-900 hover:text-indigo-600">Categories</a>
        <a href="/deals" class="text-sm font-semibold text-gray-900 hover:text-indigo-600">Deals</a>
        <a href="/wishlist" class="text-sm font-semibold text-gray-900 hover:text-indigo-600">Wishlist</a>
        <a href="/orders" class="text-sm font-semibold text-gray-900 hover:text-indigo-600">My Orders</a>
        <a href="/contact" class="text-sm font-semibold text-gray-900 hover:text-indigo-600">Contact</a>
      </div>

      

      <div class="hidden lg:flex lg:flex-1 lg:justify-end">
        <div class="flex items-center space-x-10">
          <!-- Search -->
          <div x-data="{ open: false }" class="relative">
            <button @click="open = !open; $nextTick(() => $refs.search?.focus())" class="text-gray-600 hover:text-gray-800">
              <!-- Search icon -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z" />
              </svg>
            </button>
  
            <div x-show="open" @click.away="open = false" x-transition
              class="absolute right-0 mt-2 w-64 bg-white border border-gray-200 rounded-lg shadow-lg z-50 p-2">
              <input x-ref="search" type="text" placeholder="Search..."
                class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" />
            </div>
          </div>
  
          <!-- Cart Icon -->
          <a href="/cart" class="text-gray-600 hover:text-gray-800 relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.5 6h13L17 13M7 13h10m-6 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm6 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0z" />
            </svg>
            <!-- Cart count badge (optional) -->
            <span
              class="absolute top-0 right-0 inline-block w-4 h-4 text-xs leading-4 text-center text-white bg-red-600 rounded-full">3</span>
          </a>
  
          <!-- User Profile -->
          <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" class="focus:outline-none">
              <img src="https://i.pravatar.cc/40" alt="Profile"
                class="w-10 h-10 rounded-full border-2 border-gray-300" />
            </button>
            <div x-show="open" @click.away="open = false" x-transition
              class="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-lg z-50">

              <a href="/profile" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Profile</a>
              <a href="/settings" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Settings</a>
              <a href="" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Logout</a>

            </div>
          </div>
        </div>
      </div>
    </nav>
  </header>
